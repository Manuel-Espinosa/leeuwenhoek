[project]
name = "flask-leeuwenhoek"
version = "0.1.0"
description = "Panel de depuración embebido para Flask"
readme = "README.md"
authors = [
    { name = "Manuel-Espinosa", email = "manuespinosadev@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flask>=2.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
login   = ["flask-login>=0.6"]
celery  = ["celery>=5.3"]
rq      = ["rq>=1.15"]
cache   = ["flask-caching>=2.0"]
mail    = ["flask-mail>=0.9"]
redis   = ["redis>=5.0"]
http    = ["requests>=2.31", "httpx>=0.27"]
sched   = ["apscheduler>=3.10"]
all     = ["flask-leeuwenhoek[login,celery,rq,cache,mail,redis,http,sched]"]

[project.entry-points."flask.commands"]
leeuwenhoek = "leeuwenhoek.cli:cli"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "leeuwenhoek"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "psycopg[binary]>=3.3.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
