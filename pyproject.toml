[project]
name = "flask-leeuwenhoek"
version = "0.1.0"
description = "Embedded debugging panel for Flask"
readme = "README.md"
authors = [
    { name = "Manuel-Espinosa", email = "manuespinosadev@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flask>=2.3",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
login = ["flask-login>=0.6"]
mail = ["flask-mail>=0.9"]
http = ["requests>=2.31", "httpx>=0.27"]
cache = ["flask-caching>=2.0"]
celery = ["celery>=5.3"]

[project.entry-points."flask.commands"]
leeuwenhoek = "leeuwenhoek.cli:cli"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "leeuwenhoek"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "psycopg[binary]>=3.3.6",
    "flask-mail>=0.10.0",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "types-requests>=2.33.0.20261030",
    "flask-caching>=2.4.1",
    "celery>=5.7.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# Optional dependency (the ``login`` extra): not installed in the dev environment.
module = ["flask_login", "flask_login.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery ships no type information.
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests such as building the wheel (deselect with -m \"not slow\")",
]
